name: Cloud Build, Test & Deploy

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Upload built web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-march-web-build
          path: dist/

      - name: Prepare preview redirect when deploying main
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/preview/ashenhold-phase1
          cat <<'EOF' > dist/preview/ashenhold-phase1/index.html
          <!DOCTYPE html><meta charset="utf-8"><script>location.replace('../../' + location.search + location.hash);</script>
          EOF

      - name: Deploy dist to gh-pages root (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Compute branch preview slug
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: echo "PREVIEW_SLUG=${GITHUB_REF_NAME#feature/}" >> "$GITHUB_ENV"

      - name: Deploy branch preview to gh-pages subpath
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: preview/${{ env.PREVIEW_SLUG }}
          keep_files: true

